name: Automated tests with test matrix

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Choose target
        required: true
        default: alerts_page_test
        type: choice
        options:
          - check_box_test
          - alerts_page_test
          - practice_form_test
          - text_box_test
          - run_all_tests
          - cross_browser_test
          - all_matrix
      browser_type:
        description: Browser type
        required: true
        default: chrome
        type: choice
        options:
          - chrome
          - edge
      send_report:
        description: Send report
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  #  push:
  #    branches:
  #      - stelth-mode

  schedule:
    - cron: 30 3 * * 6   # Runs at 03:30 UTC every Saturday

permissions:
  contents: read
  pages: write
  id-token: write

env:
  REMOTE_OPTIONS: '--headless --no-sandbox --disable-dev-shm-usage'


jobs:

  test:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        BROWSER: [ chrome, edge ]
        TEST_TARGET: [ check_box_test, alerts_page_test, practice_form_test, text_box_test, run_all_tests, cross_browser_test ]

    env:
      PROJECT_NAME: demoqa_com
      CREATE_ALLURE_REPORT: true
      SEND_REPORT: ${{ github.event.inputs.SEND_REPORT != '' && github.event.inputs.SEND_REPORT || 'true' }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}
      LOCAL_RUN: false
      ALLURE_RESULTS_DIR: allure-results/${{ matrix.BROWSER }}-${{ matrix.TEST_TARGET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare Allure results directory
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all_matrix' || ((github.event.inputs.browser_type == '' || github.event.inputs.browser_type == matrix.BROWSER) && (github.event.inputs.deployment_target == '' || github.event.inputs.deployment_target == matrix.TEST_TARGET)) }}
        run: |
          mkdir -p "${{ env.ALLURE_RESULTS_DIR }}"

      - name: Validate browser type
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all_matrix' || ((github.event.inputs.browser_type == '' || github.event.inputs.browser_type == matrix.BROWSER) && (github.event.inputs.deployment_target == '' || github.event.inputs.deployment_target == matrix.TEST_TARGET)) }}
        run: |
          if [[ "${{ github.event.inputs.browser_type }}" == '' ]]; then
          echo "All browsers have been selected"
          elif [[ "${{ matrix.BROWSER }}" != "${{ github.event.inputs.browser_type }}" ]]; then
          echo "Invalid browser type selected: ${{ github.event.inputs.browser_type }} for ${{ matrix.BROWSER }}"
          exit 1
          fi

      - name: Install browser
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all_matrix' || ((github.event.inputs.browser_type == '' || github.event.inputs.browser_type == matrix.BROWSER) && (github.event.inputs.deployment_target == '' || github.event.inputs.deployment_target == matrix.TEST_TARGET)) }}
        run: |
          if [[ "${{ matrix.BROWSER }}" == "chrome" ]]; then
            sudo apt-get install -y google-chrome-stable
          elif [[ "${{ matrix.BROWSER }}" == "edge" ]]; then
            sudo apt update && sudo apt install -y microsoft-edge-stable
          elif [[ "${{ matrix.BROWSER }}" == "firefox" ]]; then
            sudo apt update
            sudo apt install -y firefox
          fi

      - name: install dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all_matrix' || ((github.event.inputs.browser_type == '' || github.event.inputs.browser_type == matrix.BROWSER) && (github.event.inputs.deployment_target == '' || github.event.inputs.deployment_target == matrix.TEST_TARGET)) }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install X virtual framebuffer (Xvfb) for headless GUI support
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all_matrix' || ((github.event.inputs.browser_type == '' || github.event.inputs.browser_type == matrix.BROWSER) && (github.event.inputs.deployment_target == '' || github.event.inputs.deployment_target == matrix.TEST_TARGET)) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Download all workflow run artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all_matrix' || ((github.event.inputs.browser_type == '' || github.event.inputs.browser_type == matrix.BROWSER) && (github.event.inputs.deployment_target == '' || github.event.inputs.deployment_target == matrix.TEST_TARGET)) }}
        uses: actions/download-artifact@v4

      - name: check box test
        if: ${{ matrix.TEST_TARGET == 'check_box_test' && (github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all_matrix' || ((github.event.inputs.deployment_target == '' || github.event.inputs.deployment_target == 'check_box_test') && (github.event.inputs.browser_type == '' || github.event.inputs.browser_type == matrix.BROWSER))) }}
        env:
          BROWSER: ${{ matrix.BROWSER }}
        run: |
          TEST_NAME="check_box_test"
          REPORT="report/${TEST_NAME}/ctrf-report.json"
          xvfb-run -a pytest -m "check_box_test" --alluredir "${{ env.ALLURE_RESULTS_DIR }}" --ctrf $REPORT
          npx github-actions-ctrf $REPORT
        continue-on-error: true

      - name: alerts page test
        if: ${{ matrix.TEST_TARGET == 'alerts_page_test' && (github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all_matrix' || ((github.event.inputs.deployment_target == '' || github.event.inputs.deployment_target == 'alerts_page_test') && (github.event.inputs.browser_type == '' || github.event.inputs.browser_type == matrix.BROWSER))) }}
        env:
          BROWSER: ${{ matrix.BROWSER }}
        run: |
          TEST_NAME="alerts_page_test"
          REPORT="report/${TEST_NAME}/ctrf-report.json"
          xvfb-run -a pytest -m "alerts_page_test" --alluredir "${{ env.ALLURE_RESULTS_DIR }}" --ctrf $REPORT
          npx github-actions-ctrf $REPORT
          echo ${{ matrix.BROWSER }}
        continue-on-error: true

      - name: practice form test
        if: ${{ matrix.TEST_TARGET == 'practice_form_test' && (github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all_matrix' || ((github.event.inputs.deployment_target == '' || github.event.inputs.deployment_target == 'practice_form_test') && (github.event.inputs.browser_type == '' || github.event.inputs.browser_type == matrix.BROWSER))) }}
        env:
          BROWSER: ${{ matrix.BROWSER }}
        run: |
          TEST_NAME="practice_form_test"
          REPORT="report/${TEST_NAME}/ctrf-report.json"
          xvfb-run -a pytest -m "practice_form_test" --alluredir "${{ env.ALLURE_RESULTS_DIR }}" --ctrf $REPORT
          npx github-actions-ctrf $REPORT || true
        continue-on-error: true

      - name: text box test
        if: ${{ matrix.TEST_TARGET == 'text_box_test' && (github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all_matrix' || ((github.event.inputs.deployment_target == '' || github.event.inputs.deployment_target == 'text_box_test') && (github.event.inputs.browser_type == '' || github.event.inputs.browser_type == matrix.BROWSER))) }}
        env:
          BROWSER: ${{ matrix.BROWSER }}
        run: |
          TEST_NAME="text_box_test"
          REPORT="report/${TEST_NAME}/ctrf-report.json"
          xvfb-run -a pytest -m "text_box_test" --alluredir "${{ env.ALLURE_RESULTS_DIR }}" --ctrf $REPORT
          npx github-actions-ctrf $REPORT
        continue-on-error: true

      - name: run all tests
        if: ${{ matrix.TEST_TARGET == 'run_all_tests' && (github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all_matrix' || ((github.event.inputs.deployment_target == '' || github.event.inputs.deployment_target == 'run_all_tests') && (github.event.inputs.browser_type == '' || github.event.inputs.browser_type == matrix.BROWSER))) }}
        env:
          BROWSER: ${{ matrix.BROWSER }}
        run: |
          TEST_NAME="run_all_tests"
          REPORT="report/${TEST_NAME}/ctrf-report.json"
          xvfb-run -a pytest --alluredir "${{ env.ALLURE_RESULTS_DIR }}" --ctrf $REPORT || true --reruns 1
          npx github-actions-ctrf $REPORT
        continue-on-error: true

      - name: cross browser test
        if: ${{ matrix.TEST_TARGET == 'cross_browser_test' && (github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all_matrix' || ((github.event.inputs.deployment_target == '' || github.event.inputs.deployment_target == 'cross_browser_test') && (github.event.inputs.browser_type == '' || github.event.inputs.browser_type == matrix.BROWSER))) }}
        env:
          BROWSER: ${{ matrix.BROWSER }}
        run: |
          TEST_NAME="cross_browser_test"
          REPORT="report/${TEST_NAME}/ctrf-report.json"
          xvfb-run -a pytest --alluredir "${{ env.ALLURE_RESULTS_DIR }}" --ctrf $REPORT || true --reruns 1
          npx github-actions-ctrf $REPORT
        continue-on-error: true

      - name: Check Allure Results Directory
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all_matrix' || ((github.event.inputs.browser_type == '' || github.event.inputs.browser_type == matrix.BROWSER) && (github.event.inputs.deployment_target == '' || github.event.inputs.deployment_target == matrix.TEST_TARGET)) }}
        run: ls -la "${{ env.ALLURE_RESULTS_DIR }}"
        continue-on-error: true

      - name: Store allure results
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all_matrix' || ((github.event.inputs.browser_type == '' || github.event.inputs.browser_type == matrix.BROWSER) && (github.event.inputs.deployment_target == '' || github.event.inputs.deployment_target == matrix.TEST_TARGET))) && hashFiles(format('{0}/*', env.ALLURE_RESULTS_DIR)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          # make artifact name unique per workflow run using run_id
          name: allure-results-${{ matrix.BROWSER }}-${{ matrix.TEST_TARGET }}-${{ github.run_id }}
          path: ${{ env.ALLURE_RESULTS_DIR }}
          retention-days: 1
        continue-on-error: true


  generate-report:
    runs-on: ubuntu-latest
    needs: test
    name: Generate report
    if: always()

    steps:
      - uses: actions/setup-java@v3
        with:
          distribution: 'microsoft'
          java-version: '17'
      - run: sudo wget https://github.com/allure-framework/allure2/releases/download/2.23.1/allure-2.23.1.tgz && sudo tar -zxvf allure-2.23.1.tgz -C /opt/ && sudo ln -s /opt/allure-2.23.1/bin/allure /usr/bin/allure
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4

      - name: Merge allure artifacts and generate per-target reports
        run: |
          set -e
          mkdir -p merged_results
          mkdir -p reports

          # Collected artifact folders will look like: allure-results-<BROWSER>-<TEST_TARGET>-<RUN_ID>
          shopt -s nullglob || true

          # Build list of unique TEST_TARGET values from downloaded artifact folders
          targets=()
          for d in ./allure-results-*; do
            if [ -d "$d" ]; then
              name=$(basename "$d")
              # remove leading 'allure-results-'
              rest="${name#allure-results-}"
              # rest is now <BROWSER>-<TEST_TARGET>-<RUN_ID> (RUN_ID might be absent in older artifacts)
              # drop the last hyphen-separated segment (run id)
              rest_no_runid="${rest%-*}"
              # drop the browser prefix to get TEST_TARGET (assumes browser has no '-' itself)
              test_target="${rest_no_runid#*-}"
              # fallback: if method failed, try to take last segment as before
              if [ -z "$test_target" ]; then
                test_target="${name##*-}"
              fi
              targets+=("$test_target")
            fi
          done

          if [ ${#targets[@]} -eq 0 ]; then
            echo "No allure-results-* artifacts found; nothing to generate"
            exit 0
          fi

          # unique targets
          IFS=$'\n' read -r -d '' -a unique_targets < <(printf "%s\n" "${targets[@]}" | sort -u && printf '\0')

          for t in "${unique_targets[@]}"; do
            echo "Preparing merged results for target: $t"
            merged_dir="merged_results/$t"
            mkdir -p "$merged_dir"

            # copy contents of all artifacts that match this target (handle run_id suffix)
            for s in ./allure-results-*; do
              if [ -d "$s" ]; then
                case "$s" in
                  *-"$t" | *-"$t"-* )
                    echo "Merging from $s into $merged_dir"
                    cp -r "$s"/* "$merged_dir/" || true
                    ;;
                  *)
                    ;;
                esac
              fi
            done

            echo "Generating Allure report for $t (merged dir: $merged_dir)"
            out_dir="reports/$t"
            mkdir -p "$out_dir"
            ls -la "$merged_dir" || true
            if [ -n "$(ls -A "$merged_dir" 2>/dev/null)" ]; then
              allure generate -c "$merged_dir" -o "$out_dir" || true
            else
              echo "No results inside $merged_dir, skipping allure generate for $t"
            fi
          done

      - name: Store generated reports
        uses: actions/upload-artifact@v4
        with:
          # unique generated reports per workflow run
          name: generated-reports-${{ github.run_id }}
          path: reports
          retention-days: 1

  publish-report:
    runs-on: ubuntu-latest
    needs: generate-report
    name: Report publication
    if: always()

    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1.2.9
